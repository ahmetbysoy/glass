name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Generate wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew eksik, gradle wrapper oluşturuluyor"
            chmod +x gradlew 2>/dev/null || true
          fi
      - name: Build APK (release first, fallback debug)
        run: ./gradlew assembleRelease -x kspKotlin -x ksp || ./gradlew assembleDebug -x kspKotlin -x ksp || ./gradlew build -x kspKotlin -x ksp
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH || 'none' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'none' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'none' }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
