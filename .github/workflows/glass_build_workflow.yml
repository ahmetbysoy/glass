name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Fix permissions
        run: chmod +x gradlew || echo "gradlew yok, wrapper indiriliyor"
      - name: Download Gradle Wrapper (if missing)
        run: |
          if [ ! -f gradlew ]; then
            curl -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew || true
            chmod +x gradlew
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://services.gradle.org/distributions/gradle-8.5-bin.zip || true
          fi
      - name: Build APK (debug/release)
        run: ./gradlew assembleRelease || ./gradlew assembleDebug
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
